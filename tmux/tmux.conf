# Change the prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Basics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on

# True color / terminal behavior
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"

# Vi-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane styling
set -g pane-border-lines heavy
set -g pane-border-indicators both
setw -g window-style 'fg=colour247,bg=colour236'
setw -g window-active-style 'fg=terminal,bg=terminal'
# Enable a status bar on the top edge of every pane
set -g pane-border-status top
# Customize the text displayed inside the pane status bar (shows pane index and current command)
set -g pane-border-format " [ #I:#W ] "

# New windows/panes inherit cwd
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session switcher
bind S choose-tree -Zw

# Status
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120
set -g status-left " #[bold]#S "
set -g status-right " #{pane_current_path} | %Y-%m-%d %H:%M "

set -g window-status-format " #I:#W"
set -g window-status-current-format " #[fg=black,bg=white] #I:#W #[default] "

